name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Install cookie capture dependency
        run: npm ci

      - name: Package Windows
        shell: pwsh
        run: |
          $packageDir = "release_windows"
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination $packageDir -Recurse -Force
          Copy-Item -Path "capture_auth_cookies.js","package.json","package-lock.json","README.md" -Destination $packageDir -Force
          Copy-Item -Path "node_modules" -Destination $packageDir -Recurse -Force
          Copy-Item -Path (Get-Command node).Source -Destination "$packageDir\node.exe" -Force
          Compress-Archive -Path "$packageDir\*" -DestinationPath "attendance_client_windows_${{ github.ref_name }}.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: attendance_client_windows_${{ github.ref_name }}.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk attendance_client_android_${{ github.ref_name }}.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: attendance_client_android_${{ github.ref_name }}.apk

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Attendance Client ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
